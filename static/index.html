<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>truth</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --night: #070B18;
            --indigo: #141B36;
            --gold: #F2C879;
            --flame: #FFF3DC;
            --dusk: #8CA3C9;
            --parchment: #EAE4D6;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--night);
            color: var(--parchment);
            font-family: 'Figtree', sans-serif;
        }

        #sky {
            position: fixed;
            inset: 0;
            display: block;
        }

        /* ---------- top bar ---------- */
        .bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.4rem 2rem;
            pointer-events: none;
        }

        .bar > * { pointer-events: auto; }

        .wordmark {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 0.08em;
            color: var(--flame);
            text-decoration: none;
        }

        .bar nav {
            display: flex;
            align-items: center;
            gap: 1.75rem;
        }

        .bar nav a, .bar nav button {
            font-family: 'Figtree', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--dusk);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: color 0.25s;
        }

        .bar nav a:hover, .bar nav button:hover { color: var(--gold); }

        .bar nav a:focus-visible, .bar nav button:focus-visible,
        .chip:focus-visible, .send:focus-visible, .nav-arrow:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
            border-radius: 2px;
        }

        /* ---------- constellation count ---------- */
        .gathered {
            position: fixed;
            top: 5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--dusk);
            opacity: 0;
            transition: opacity 0.8s;
            pointer-events: none;
        }

        .gathered.visible { opacity: 0.85; }
        .gathered em { font-style: normal; color: var(--gold); }

        /* ---------- welcome ---------- */
        .welcome {
            position: fixed;
            left: 50%;
            top: 24%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: min(680px, 90vw);
            transition: opacity 0.8s, transform 0.8s;
            pointer-events: none;
        }

        .welcome.hidden { opacity: 0; transform: translate(-50%, -14px); }

        .welcome h1 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 500;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            color: var(--flame);
            text-shadow: 0 0 40px rgba(242, 200, 121, 0.25);
        }

        .welcome p {
            margin-top: 0.9rem;
            font-weight: 300;
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--dusk);
        }

        /* ---------- exchange panel ---------- */
        .console {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            z-index: 10;
            width: min(720px, 94vw);
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            padding-bottom: 1.6rem;
        }

        .panel {
            display: none;
            background: rgba(13, 18, 40, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(140, 163, 201, 0.16);
            border-radius: 14px;
            padding: 1.6rem 1.8rem 1.2rem;
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.5);
        }

        .panel.visible { display: block; animation: rise 0.5s ease; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .panel .question {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-weight: 500;
            font-size: 1.35rem;
            line-height: 1.4;
            color: var(--gold);
            margin-bottom: 0.9rem;
        }

        .panel .answer {
            font-size: 0.9rem;
            font-weight: 300;
            line-height: 1.85;
            color: var(--parchment);
            max-height: 38vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .panel .answer strong { color: var(--gold); font-weight: 500; }
        .panel .answer em { color: var(--dusk); }

        .panel .answer::-webkit-scrollbar { width: 4px; }
        .panel .answer::-webkit-scrollbar-thumb {
            background: rgba(140, 163, 201, 0.3);
            border-radius: 2px;
        }

        .panel-nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 0.9rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(140, 163, 201, 0.12);
        }

        .panel-nav .which {
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--dusk);
            margin-right: auto;
        }

        .nav-arrow {
            width: 30px; height: 30px;
            border: 1px solid rgba(140, 163, 201, 0.25);
            border-radius: 50%;
            background: none;
            color: var(--dusk);
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            transition: all 0.2s;
        }

        .nav-arrow:hover:not(:disabled) { color: var(--gold); border-color: var(--gold); }
        .nav-arrow:disabled { opacity: 0.25; cursor: default; }

        /* ---------- input ---------- */
        .ask-row {
            display: flex;
            gap: 0.7rem;
            background: rgba(13, 18, 40, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(140, 163, 201, 0.2);
            border-radius: 999px;
            padding: 0.45rem 0.45rem 0.45rem 1.5rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .ask-row:focus-within {
            border-color: rgba(242, 200, 121, 0.55);
            box-shadow: 0 0 30px rgba(242, 200, 121, 0.12);
        }

        .ask {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: 'Figtree', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--parchment);
        }

        .ask::placeholder { color: rgba(140, 163, 201, 0.6); }

        .send {
            width: 42px; height: 42px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #FFE9BC, var(--gold) 60%, #C99B4E);
            color: #1a1204;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s, box-shadow 0.25s;
            box-shadow: 0 0 18px rgba(242, 200, 121, 0.35);
        }

        .send:hover:not(:disabled) {
            transform: scale(1.07);
            box-shadow: 0 0 28px rgba(242, 200, 121, 0.55);
        }

        .send:disabled { opacity: 0.45; cursor: default; }
        .send svg { width: 18px; height: 18px; }

        /* ---------- suggestions ---------- */
        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            transition: opacity 0.5s;
        }

        .chips.hidden { opacity: 0; pointer-events: none; }

        .chip {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.95rem;
            padding: 0.5rem 1.1rem;
            border: 1px solid rgba(140, 163, 201, 0.25);
            border-radius: 999px;
            background: rgba(13, 18, 40, 0.5);
            color: var(--dusk);
            cursor: pointer;
            transition: all 0.3s;
        }

        .chip:hover {
            color: var(--gold);
            border-color: rgba(242, 200, 121, 0.5);
            box-shadow: 0 0 16px rgba(242, 200, 121, 0.12);
        }

        /* ---------- star tooltip ---------- */
        .tooltip {
            position: fixed;
            z-index: 30;
            max-width: 260px;
            padding: 0.5rem 0.85rem;
            background: rgba(13, 18, 40, 0.92);
            border: 1px solid rgba(242, 200, 121, 0.3);
            border-radius: 8px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.95rem;
            color: var(--flame);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .tooltip.visible { opacity: 1; }

        @media (max-width: 640px) {
            .bar { padding: 1.1rem 1.2rem; }
            .bar nav { gap: 1rem; }
            .bar nav a, .bar nav button { font-size: 0.68rem; }
            .welcome { top: 19%; }
            .panel { padding: 1.2rem 1.2rem 1rem; }
            .panel .answer { max-height: 32vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            .panel.visible { animation: none; }
        }
    </style>
</head>
<body>

    <canvas id="sky"></canvas>

    <header class="bar">
        <a class="wordmark" href="/">truth</a>
        <nav>
            <a href="/about">What is Truth?</a>
            <a href="/scriptures">Words of Truth</a>
            <button id="reset-btn">Begin again</button>
        </nav>
    </header>

    <div class="gathered" id="gathered"><em id="gathered-n">0</em> <span id="gathered-label">truths gathered</span></div>

    <div class="welcome" id="welcome">
        <h1>Seek, and ye shall find.</h1>
        <p>You stand in the night with one small light before you. Every question you ask kindles it — and every answer becomes a star you keep. Ask about scripture, doctrine, or the things of eternity.</p>
    </div>

    <div class="console">
        <div class="panel" id="panel">
            <div class="question" id="panel-q"></div>
            <div class="answer" id="panel-a"></div>
            <div class="panel-nav">
                <span class="which" id="panel-which"></span>
                <button class="nav-arrow" id="prev-btn" aria-label="Previous truth">&#8249;</button>
                <button class="nav-arrow" id="next-btn" aria-label="Next truth">&#8250;</button>
            </div>
        </div>

        <div class="ask-row">
            <input class="ask" id="ask" type="text" placeholder="Ask what you would know&hellip;" autocomplete="off" autofocus />
            <button class="send" id="send" aria-label="Ask">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>
        </div>

        <div class="chips" id="chips">
            <button class="chip">What is the Book of Mormon?</button>
            <button class="chip">How can I receive personal revelation?</button>
            <button class="chip">What is the plan of salvation?</button>
            <button class="chip">Who is Jesus Christ?</button>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const sessionId = crypto.randomUUID();

        /* ================= scene ================= */

        const canvas = document.getElementById('sky');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x070B18);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070B18, 0.008);

        const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 2.5, 26);

        // soft radial glow texture, shared by all lights in the scene
        function glowTexture(inner, falloff) {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            g.addColorStop(0, inner);
            g.addColorStop(falloff, 'rgba(242, 200, 121, 0.25)');
            g.addColorStop(1, 'rgba(242, 200, 121, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(c);
        }

        const softTex = glowTexture('rgba(255, 243, 220, 1)', 0.25);
        const starTex = glowTexture('rgba(255, 255, 255, 1)', 0.12);

        /* --- distant starfield: the unanswered night --- */
        const starCount = 1400;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const r = 90 + Math.random() * 180;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
            starPos[i * 3 + 2] = r * Math.cos(phi);
        }
        const starGeo = new THREE.BufferGeometry();
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({
            size: 1.1, map: starTex, color: 0x8CA3C9, transparent: true,
            opacity: 0.65, depthWrite: false, blending: THREE.AdditiveBlending
        }));
        scene.add(starField);

        /* --- dust drifting toward the light: seekers --- */
        const dustCount = 320;
        const dustPos = new Float32Array(dustCount * 3);
        const dustSpeed = new Float32Array(dustCount);
        function respawnDust(i) {
            const r = 25 + Math.random() * 45;
            const theta = Math.random() * Math.PI * 2;
            dustPos[i * 3]     = r * Math.cos(theta);
            dustPos[i * 3 + 1] = (Math.random() - 0.5) * 24;
            dustPos[i * 3 + 2] = r * Math.sin(theta) - 10;
            dustSpeed[i] = 0.008 + Math.random() * 0.02;
        }
        for (let i = 0; i < dustCount; i++) respawnDust(i);
        const dustGeo = new THREE.BufferGeometry();
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
            size: 0.5, map: softTex, color: 0xF2C879, transparent: true,
            opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending
        }));
        scene.add(dust);

        /* --- the Light of Truth --- */
        const orb = new THREE.Group();
        const core = new THREE.Mesh(
            new THREE.SphereGeometry(0.9, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xFFF3DC })
        );
        orb.add(core);

        const glowLayers = [];
        [[4.5, 0.9, 0xFFF3DC], [9, 0.5, 0xF2C879], [17, 0.22, 0xF2C879]].forEach(([s, o, col]) => {
            const sp = new THREE.Sprite(new THREE.SpriteMaterial({
                map: softTex, color: col, transparent: true, opacity: o,
                depthWrite: false, blending: THREE.AdditiveBlending
            }));
            sp.scale.setScalar(s);
            sp.userData.baseScale = s;
            orb.add(sp);
            glowLayers.push(sp);
        });

        const light = new THREE.PointLight(0xF2C879, 60, 120, 1.8);
        orb.add(light);
        scene.add(orb);

        /* --- constellation of gathered truths --- */
        const constellation = new THREE.Group();
        scene.add(constellation);
        const truthStars = [];   // { sprite, exchangeIndex }
        const flights = [];      // in-flight star animations

        function addTruthStar(exchangeIndex, question) {
            const i = truthStars.length;
            const angle = i * 2.39996;                      // golden angle spacing
            const radius = 7.5 + (i % 3) * 1.1;
            const target = new THREE.Vector3(
                radius * Math.cos(angle),
                Math.sin(i * 1.7) * 1.8,
                radius * Math.sin(angle)
            );
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: starTex, color: 0xFFE9BC, transparent: true, opacity: 0,
                depthWrite: false, blending: THREE.AdditiveBlending
            }));
            sprite.scale.setScalar(1.7);
            sprite.userData = { exchangeIndex, question, baseScale: 1.7 };
            sprite.position.set(0, 0, 0);
            constellation.add(sprite);
            truthStars.push(sprite);
            if (REDUCED) {
                sprite.position.copy(target);
                sprite.material.opacity = 1;
            } else {
                flights.push({ sprite, target, t0: clock.getElapsedTime() });
            }
        }

        /* --- interaction: hover + click stars --- */
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2(-2, -2);
        const parallax = new THREE.Vector2(0, 0);
        let hovered = null;
        const tooltip = document.getElementById('tooltip');

        window.addEventListener('pointermove', (e) => {
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
            parallax.set(pointer.x, pointer.y);
            tooltip.style.left = (e.clientX + 14) + 'px';
            tooltip.style.top = (e.clientY + 14) + 'px';
        });

        canvas.addEventListener('click', () => {
            if (hovered) viewExchange(hovered.userData.exchangeIndex);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* --- animation loop --- */
        const clock = new THREE.Clock();
        let streaming = false;
        let glowTarget = 1;
        let glowCurrent = 1;

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            glowCurrent += (glowTarget - glowCurrent) * 0.02;
            const pulse = REDUCED ? 0
                : streaming ? Math.sin(t * 6) * 0.07
                : Math.sin(t * 1.4) * 0.025;

            glowLayers.forEach((sp) => {
                sp.scale.setScalar(sp.userData.baseScale * glowCurrent * (1 + pulse));
            });
            core.scale.setScalar(glowCurrent * (1 + pulse * 0.5));
            light.intensity = 60 * glowCurrent * (1 + pulse * 2);

            if (!REDUCED) {
                constellation.rotation.y = t * 0.05;
                starField.rotation.y = t * 0.004;

                const dustArr = dustGeo.attributes.position.array;
                for (let i = 0; i < dustCount; i++) {
                    const x = dustArr[i * 3], y = dustArr[i * 3 + 1], z = dustArr[i * 3 + 2];
                    const d = Math.sqrt(x * x + y * y + z * z);
                    if (d < 2.5) { respawnDust(i); continue; }
                    const s = dustSpeed[i] * (streaming ? 3 : 1);
                    dustArr[i * 3]     -= (x / d) * s;
                    dustArr[i * 3 + 1] -= (y / d) * s * 0.4;
                    dustArr[i * 3 + 2] -= (z / d) * s;
                }
                dustGeo.attributes.position.needsUpdate = true;

                // star fly-in from the orb to its place in the constellation
                for (let i = flights.length - 1; i >= 0; i--) {
                    const f = flights[i];
                    const p = Math.min((t - f.t0) / 1.4, 1);
                    const ease = 1 - Math.pow(1 - p, 3);
                    f.sprite.position.lerpVectors(new THREE.Vector3(0, 0, 0), f.target, ease);
                    f.sprite.material.opacity = ease;
                    if (p >= 1) flights.splice(i, 1);
                }

                camera.position.x += (parallax.x * 3 - camera.position.x) * 0.03;
                camera.position.y += (2.5 + parallax.y * 1.5 - camera.position.y) * 0.03;
                camera.lookAt(0, 0, 0);
            }

            // hover detection on gathered stars
            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(truthStars, false);
            const hit = hits.length ? hits[0].object : null;
            if (hit !== hovered) {
                if (hovered) hovered.scale.setScalar(hovered.userData.baseScale);
                hovered = hit;
                if (hovered) {
                    hovered.scale.setScalar(hovered.userData.baseScale * 1.6);
                    tooltip.textContent = hovered.userData.question;
                    tooltip.classList.add('visible');
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.classList.remove('visible');
                    canvas.style.cursor = 'default';
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        /* ================= chat ================= */

        const askInput = document.getElementById('ask');
        const sendBtn = document.getElementById('send');
        const welcome = document.getElementById('welcome');
        const chips = document.getElementById('chips');
        const panel = document.getElementById('panel');
        const panelQ = document.getElementById('panel-q');
        const panelA = document.getElementById('panel-a');
        const panelWhich = document.getElementById('panel-which');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const gathered = document.getElementById('gathered');
        const gatheredN = document.getElementById('gathered-n');
        const gatheredLabel = document.getElementById('gathered-label');

        const exchanges = [];   // { q, a }
        let viewIndex = -1;

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatText(text) {
            let html = escapeHtml(text);
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            html = html.replace(/\n\n/g, '<br><br>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function viewExchange(i) {
            if (i < 0 || i >= exchanges.length) return;
            viewIndex = i;
            panelQ.textContent = exchanges[i].q;
            panelA.innerHTML = formatText(exchanges[i].a);
            panelWhich.textContent = `Truth ${i + 1} of ${exchanges.length}`;
            prevBtn.disabled = i === 0;
            nextBtn.disabled = i === exchanges.length - 1;
            panel.classList.add('visible');
        }

        prevBtn.addEventListener('click', () => viewExchange(viewIndex - 1));
        nextBtn.addEventListener('click', () => viewExchange(viewIndex + 1));

        async function sendMessage() {
            const message = askInput.value.trim();
            if (!message || streaming) return;

            welcome.classList.add('hidden');
            chips.classList.add('hidden');
            askInput.value = '';
            streaming = true;
            sendBtn.disabled = true;

            exchanges.push({ q: message, a: '' });
            const idx = exchanges.length - 1;
            viewExchange(idx);

            let hadError = false;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, session_id: sessionId })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const frames = buffer.split('\n\n');
                    buffer = frames.pop();
                    for (const frame of frames) {
                        if (!frame.startsWith('data: ')) continue;
                        const data = frame.slice(6);
                        if (data === '[DONE]') continue;
                        if (data === '[ERROR]') { hadError = true; continue; }
                        let text;
                        try { text = JSON.parse(data); } catch { text = data; }
                        exchanges[idx].a += text;
                        if (viewIndex === idx) {
                            panelA.innerHTML = formatText(exchanges[idx].a);
                            panelA.scrollTop = panelA.scrollHeight;
                        }
                    }
                }
            } catch (err) {
                hadError = true;
                exchanges[idx].a = 'Something interrupted the connection. Ask again in a moment.';
                if (viewIndex === idx) panelA.innerHTML = formatText(exchanges[idx].a);
            }

            streaming = false;
            sendBtn.disabled = false;

            if (hadError) {
                // an unanswered question isn't a gathered truth — show it, but keep no star
                exchanges.pop();
                panelWhich.textContent = 'Not gathered — ask again';
                prevBtn.disabled = exchanges.length === 0;
                nextBtn.disabled = true;
                viewIndex = exchanges.length;
            } else {
                // the answer becomes a star in the constellation, and the light grows
                addTruthStar(idx, exchanges[idx].q);
                glowTarget = Math.min(1 + exchanges.length * 0.09, 2.1);
                gatheredN.textContent = exchanges.length;
                gatheredLabel.textContent = exchanges.length === 1 ? 'truth gathered' : 'truths gathered';
                gathered.classList.add('visible');
            }

            askInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);
        askInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        chips.querySelectorAll('.chip').forEach((chip) => {
            chip.addEventListener('click', () => {
                askInput.value = chip.textContent;
                sendMessage();
            });
        });

        document.getElementById('reset-btn').addEventListener('click', async () => {
            try {
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
            } catch (e) {}

            exchanges.length = 0;
            viewIndex = -1;
            panel.classList.remove('visible');
            welcome.classList.remove('hidden');
            chips.classList.remove('hidden');
            gathered.classList.remove('visible');
            gatheredN.textContent = '0';
            glowTarget = 1;

            truthStars.forEach((s) => constellation.remove(s));
            truthStars.length = 0;
            flights.length = 0;

            askInput.focus();
        });
    </script>
</body>
</html>
